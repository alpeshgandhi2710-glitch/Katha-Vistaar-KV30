name: KV30 Platform Build Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'MAIN-PROGRAM/mobile/**'
      - 'MAIN-PROGRAM/desktop-electron/**'
      - 'MAIN-PROGRAM/scripts/**'
      - '.github/workflows/kv30-platform-build.yml'
      - 'KV30-CONTINUE-HERE.md'
  push:
    paths:
      - 'MAIN-PROGRAM/mobile/**'
      - 'MAIN-PROGRAM/desktop-electron/**'
      - 'MAIN-PROGRAM/scripts/**'
      - '.github/workflows/kv30-platform-build.yml'
      - 'KV30-CONTINUE-HERE.md'

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: |
            platform-tools
            platforms;android-35
            build-tools;34.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true
      - run: bash scripts/bootstrap-android-host.sh
        working-directory: MAIN-PROGRAM/mobile
      - run: flutter pub get
        working-directory: MAIN-PROGRAM/mobile
      - run: flutter analyze --no-pub
        working-directory: MAIN-PROGRAM/mobile
      - run: flutter build apk --release --flavor development --dart-define=KV_API_BASE_URL=https://build-validation.invalid
        working-directory: MAIN-PROGRAM/mobile
      - run: flutter build appbundle --release --flavor production --dart-define=KV_API_BASE_URL=https://build-validation.invalid
        working-directory: MAIN-PROGRAM/mobile
      - run: flutter build apk --release --flavor production --dart-define=KV_API_BASE_URL=https://build-validation.invalid
        working-directory: MAIN-PROGRAM/mobile
      - run: node MAIN-PROGRAM/scripts/verify-native-build-output.js android
      - name: Android emulator launch smoke acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -euo pipefail
            OUT=MAIN-PROGRAM/.native-build-artifacts/android
            mkdir -p "$OUT"
            adb install MAIN-PROGRAM/mobile/build/app/outputs/flutter-apk/app-development-release.apk
            adb shell am force-stop com.kathavistaar.kv30.dev || true
            adb shell monkey -p com.kathavistaar.kv30.dev -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.kathavistaar.kv30.dev | tr -d '\r' | grep -Eq '[0-9]'
            adb logcat -d -v threadtime > "$OUT/emulator-logcat-errors.txt"
            ! grep -Eiq 'FATAL EXCEPTION|Fatal signal[[:space:]]+[0-9]+' "$OUT/emulator-logcat-errors.txt"
            adb shell screencap -p /sdcard/kv30-launch.png
            adb pull /sdcard/kv30-launch.png "$OUT/emulator-launch.png"
            test -s "$OUT/emulator-launch.png"
            adb shell pidof com.kathavistaar.kv30.dev | tr -d '\r' | grep -Eq '[0-9]'
            printf '%s\n' '{"status":"PASS","kind":"android_emulator_launch_smoke","assetAcceptance":"PASS-ASSET","physicalDeviceExecution":"NOT_CLAIMED"}' > "$OUT/device-smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: kv30-android-native-build-verification-only
          if-no-files-found: error
          path: MAIN-PROGRAM/.native-build-artifacts/android/

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select and record Xcode 16.4
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.4.app || { ls -d /Applications/Xcode*.app 2>/dev/null || true; exit 33; }
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true
      - run: bash scripts/bootstrap-ios-host.sh
        working-directory: MAIN-PROGRAM/mobile
      - run: flutter pub get
        working-directory: MAIN-PROGRAM/mobile
      - run: flutter analyze --no-pub
        working-directory: MAIN-PROGRAM/mobile
      - run: flutter build ios --release --no-codesign --dart-define=KV_API_BASE_URL=https://build-validation.invalid
        working-directory: MAIN-PROGRAM/mobile
      - run: flutter build ios --simulator --release --no-codesign --dart-define=KV_API_BASE_URL=https://build-validation.invalid
        working-directory: MAIN-PROGRAM/mobile
      - run: node MAIN-PROGRAM/scripts/verify-native-build-output.js ios
      - name: iOS Simulator launch smoke acceptance
        run: |
          set -euo pipefail
          OUT=MAIN-PROGRAM/.native-build-artifacts/ios-simulator-smoke
          mkdir -p "$OUT"
          SIM_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$SIM_UDID"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" MAIN-PROGRAM/mobile/build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$SIM_UDID" com.kathavistaar 2>&1 | tee "$OUT/launch.log"
          grep -Eq '^[^:[:space:]]+:[[:space:]]*[0-9]+' "$OUT/launch.log"
          xcrun simctl io "$SIM_UDID" screenshot "$OUT/launch.png"
          test -s "$OUT/launch.png"
          printf '%s\n' '{"status":"PASS","kind":"ios_simulator_launch_smoke","assetAcceptance":"PASS-ASSET","physicalDeviceExecution":"NOT_CLAIMED"}' > "$OUT/device-smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: kv30-ios-native-build-verification-only
          if-no-files-found: error
          path: MAIN-PROGRAM/.native-build-artifacts/ios/
      - uses: actions/upload-artifact@v4
        with:
          name: kv30-ios-simulator-smoke-evidence
          if-no-files-found: error
          path: MAIN-PROGRAM/.native-build-artifacts/ios-simulator-smoke/

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MAIN-PROGRAM/desktop-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      
