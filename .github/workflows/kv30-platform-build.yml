name: KV30 Platform Build Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "MAIN-PROGRAM/mobile/"
      - "MAIN-PROGRAM/desktop-electron/"
      - "MAIN-PROGRAM/scripts/"
      - ".【entity-github¦canonical_name=GitHub】/workflows/kv30-platform-build.yml"
      - "KV30-CONTINUE-HERE.md"
  push:
    paths:
      - "MAIN-PROGRAM/mobile/"
      - "MAIN-PROGRAM/desktop-electron/"
      - "MAIN-PROGRAM/scripts/"
      - ".【entity-github¦canonical_name=GitHub】/workflows/kv30-platform-build.yml"
      - "KV30-CONTINUE-HERE.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: kv30-platform-build-${{ 【entity-github¦canonical_name=GitHub】.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.24.3"
  KV_API_BASE_URL: "https://build-validation.invalid"

jobs:
  android:
    name: Android build and emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          packages: |
            platform-tools
            platforms;android-35
            build-tools;34.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Record toolchain
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          sdkmanager --list_installed
      - name: Bootstrap Android host
        working-directory: MAIN-PROGRAM/mobile
        run: bash scripts/bootstrap-android-host.sh
      - name: Resolve dependencies
        working-directory: MAIN-PROGRAM/mobile
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: MAIN-PROGRAM/mobile
        run: flutter analyze --no-pub
      - name: Build development APK
        working-directory: MAIN-PROGRAM/mobile
        run: >
          flutter build apk --release
          --flavor development
          --dart-define=KV_API_BASE_URL=${{ env.KV_API_BASE_URL }}
      - name: Build production APK
        working-directory: MAIN-PROGRAM/mobile
        run: >
          flutter build apk --release
          --flavor production
          --dart-define=KV_API_BASE_URL=${{ env.KV_API_BASE_URL }}
      - name: Build production AAB
        working-directory: MAIN-PROGRAM/mobile
        run: >
          flutter build appbundle --release
          --flavor production
          --dart-define=KV_API_BASE_URL=${{ env.KV_API_BASE_URL }}
      - name: Verify Android artifacts and hashes
        run: node MAIN-PROGRAM/scripts/verify-native-build-output.js android
      - name: Android emulator launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -euo pipefail
            OUT=MAIN-PROGRAM/.native-build-artifacts/android
            mkdir -p "$OUT"
            adb install [STRIPPED 73 bytes].apk
            adb shell am force-stop com.kathavistaar.kv30.dev || true
            adb shell monkey -p com.kathavistaar.kv30.dev -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.kathavistaar.kv30.dev | tr -d '\r' | grep -Eq '[0-9]'
            adb logcat -d -v threadtime > "$OUT/emulator-logcat-errors.txt"
            if grep -Eiq 'FATAL EXCEPTION|Fatal signal[[:space:]]+[0-9]+' "$OUT/emulator-logcat-errors.txt"; then
              echo "Fatal Android crash signature found" >&2
              exit 1
            fi
            adb shell screencap -p /sdcard/kv30-launch.png
            adb pull /sdcard/kv30-launch.png "$OUT/emulator-launch.png"
            test -s "$OUT/emulator-launch.png"
            printf '%s\n' '{"status":"PASS","kind":"android_emulator_launch_smoke","assetAcceptance":"PASS-ASSET","physicalDeviceExecution":"NOT_CLAIMED"}' > "$OUT/device-smoke.json"
      - name: Upload Android native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv30-android-native-build-verification-only
          if-no-files-found: error
          path: MAIN-PROGRAM/.native-build-artifacts/android/
          retention-days: 90

  ios:
    name: iOS unsigned build and simulator smoke
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          else
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            echo "Required Xcode 16.4 is unavailable"
            exit 33
          fi
          xcodebuild -version
          xcode-select -p
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Record toolchain
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          xcodebuild -version
          xcrun simctl list devices available
      - name: Bootstrap iOS host
        working-directory: MAIN-PROGRAM/mobile
        run: bash scripts/bootstrap-ios-host.sh
      - name: Resolve dependencies
        working-directory: MAIN-PROGRAM/mobile
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: MAIN-PROGRAM/mobile
        run: flutter analyze --no-pub
      - name: Build unsigned iOS app
        working-directory: MAIN-PROGRAM/mobile
        run: >
          flutter build ios --release --no-codesign
          --dart-define=KV_API_BASE_URL=${{ env.KV_API_BASE_URL }}
      - name: Build iOS simulator app
        working-directory: MAIN-PROGRAM/mobile
        run: >
          flutter build ios --simulator --release --no-codesign
          --dart-define=KV_API_BASE_URL=${{ env.KV_API_BASE_URL }}
      - name: Verify iOS build output
        run: node MAIN-PROGRAM/scripts/verify-native-build-output.js ios
      - name: iOS Simulator launch smoke
        run: |
          set -euo pipefail
          OUT=MAIN-PROGRAM/.native-build-artifacts/ios-simulator-smoke
          mkdir -p "$OUT"
          SIM_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$SIM_UDID"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" MAIN-PROGRAM/mobile/build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$SIM_UDID" com.kathavistaar 2>&1 | tee "$OUT/launch.log"
          grep -Eq '^[^:[:space:]]+:[[:space:]]*[0-9]+' "$OUT/launch.log"
          xcrun simctl io "$SIM_UDID" screenshot "$OUT/launch.png"
          test -s "$OUT/launch.png"
          printf '%s\n' '{"status":"PASS","kind":"ios_simulator_launch_smoke","assetAcceptance":"PASS-ASSET","physicalDeviceExecution":"NOT_CLAIMED"}' > "$OUT/device-smoke.json"
      - name: Record signing status
        if: always()
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          OUT=MAIN-PROGRAM/.native-build-artifacts/ios
          mkdir -p "$OUT"
          if [[ -n "${IOS_CERTIFICATE_BASE64:-}" && -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" && -n "${IOS_TEAM_ID:-}" ]]; then
            printf '%s\n' '{"status":"CONFIGURED_NOT_EXECUTED","signedIPA":"NOT_BUILT_BY_THIS_WORKFLOW","productionReleaseReady":false}' > "$OUT/ios-signing-status.json"
          else
            printf '%s\n' '{"status":"SIGNING_NOT_CONFIGURED","signedIPA":"NOT_BUILT","productionReleaseReady":false}' > "$OUT/ios-signing-status.json"
          fi
      - name: Upload iOS native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv30-ios-native-build-verification-only
          if-no-files-found: error
          path: MAIN-PROGRAM/.native-build-artifacts/ios/
          retention-days: 90
      - name: Upload iOS simulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv30-ios-simulator-smoke-evidence
          if-no-files-found: error
          path: MAIN-PROGRAM/.native-build-artifacts/ios-simulator-smoke/
          retention-days: 90

  desktop:
    name: Desktop shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: MAIN-PROGRAM/desktop-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts
          else
            echo "::warning::package-lock.json missing; npm install is not lockfile-reproducible"
            npm install --ignore-scripts
          fi
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv30-desktop-evidence
          if-no-files-found: error
          path: |
            MAIN-PROGRAM/desktop-electron/
            !MAIN-PROGRAM/desktop-electron/node_modules/
          retention-days: 90

  release-acceptance:
    name: Aggregate platform results
    runs-on: ubuntu-latest
    needs: [android, ios, desktop]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download Android evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kv30-android-native-build-verification-only
          path: MAIN-PROGRAM/.native-build-artifacts/android/
      - name: Download iOS native build evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kv30-ios-native-build-verification-only
          path: MAIN-PROGRAM/.native-build-artifacts/ios/
      - name: Download iOS simulator evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kv30-ios-simulator-smoke-evidence
          path: MAIN-PROGRAM/.native-build-artifacts/ios-simulator-smoke/
      - name: Download desktop evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kv30-desktop-evidence
          path: MAIN-PROGRAM/.native-build-artifacts/desktop/
      - name: Write aggregate acceptance status
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          set -euo pipefail
          OUT=MAIN-PROGRAM/.native-build-artifacts/release-acceptance
          mkdir -p "$OUT"
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          root = Path("MAIN-PROGRAM/.native-build-artifacts")
          jobs = {
              "android": os.getenv("ANDROID_RESULT", "unknown"),
              "ios": os.getenv("IOS_RESULT", "unknown"),
              "desktop": os.getenv("DESKTOP_RESULT", "unknown"),
          }
          signing_file = root / "ios" / "ios-signing-status.json"
          signing_status = "UNKNOWN"
          if signing_file.is_file():
              try:
                  signing_status = json.loads(signing_file.read_text(encoding="utf-8")).get("status", "UNKNOWN")
              except Exception:
                  signing_status = "INVALID_EVIDENCE"
          required_files = [
              root / "android" / "device-smoke.json",
              root / "ios-simulator-smoke" / "device-smoke.json",
              root / "ios" / "ios-signing-status.json",
          ]
          evidence_files_present = all(path.is_file() for path in required_files)
          all_jobs_pass = all(value == "success" for value in jobs.values())
          result = {
              "schema": "kv30.platform-build-acceptance.v1",
              "generatedAtUtc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platformJobs": jobs,
              "requiredEvidenceFilesPresent": evidence_files_present,
              "iosSigningStatus": signing_status,
              "binaryBuildVerified": jobs["android"] == "success" and jobs["ios"] == "success",
              "desktopChecksPassed": jobs["desktop"] == "success",
              "signedIpaBuilt": False,
              "productionReleaseReady": False,
              "status": "PASS_BUILD_AND_SIMULATOR_SMOKE_ONLY" if all_jobs_pass and evidence_files_present else "BLOCKED_OR_FAILED",
              "notes": [
                  "This workflow does not create or claim a signed IPA.",
                  "Simulator acceptance is not physical-device acceptance.",
                  "Production release remains false until signing, export, and release governance are independently verified."
              ]
          }
          target = root / "release-acceptance" / "platform-build-acceptance.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          if not all_jobs_pass or not evidence_files_present:
              raise SystemExit("Platform jobs failed or required evidence is missing; release acceptance blocked.")
          PY
      - name: Upload aggregate acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv30-native-release-acceptance-evidence
          if-no-files-found: error
          path: MAIN-PROGRAM/.native-build-artifacts/release-acceptance/
          retention-days: 90
