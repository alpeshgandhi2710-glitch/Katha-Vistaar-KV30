name: "KV30 Native Android Build Pipeline"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release baseline identifier"
        required: true
        default: "KV30-R116-BASELINE"
      build_target:
        description: "Target artifact type (apk / aab)"
        required: true
        default: "both"

jobs:
  build-android-native:
    name: "Compile Android APK & AAB"
    runs-on: [self-hosted, linux, x64, android-runner]
    timeout-minutes: 45

    steps:
      - name: "Checkout Sealed Baseline"
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event.inputs.release_tag }}"
          submodules: recursive

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Set up Android SDK Tools"
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"

      - name: "Set up Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true

      - name: "Pre-Flight Dependency & Checksum Verification"
        run: |
          echo "[*] Verifying master baseline integrity..."
          sha256sum -c katha_vistaar_r116_sha256_checksum.txt
          flutter --version
          flutter doctor -v

      - name: "Build Android APK (Signed Release)"
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=./build/app/outputs/symbols

      - name: "Build Android App Bundle (AAB)"
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=./build/app/outputs/symbols

      - name: "Compute Cryptographic Checksums of Native Artifacts"
        run: |
          mkdir -p ./build/dist/
          cp build/app/outputs/flutter-apk/*.apk ./build/dist/
          cp build/app/outputs/bundle/release/*.aab ./build/dist/
          cd ./build/dist/
          sha256sum * > android_artifacts_sha256.txt
          cat android_artifacts_sha256.txt

      - name: "Archive Verified Android Binaries"
        uses: actions/upload-artifact@v4
        with:
          name: "kv30-r116-android-binaries"
          path: "./build/dist/*"
          if-no-files-found: error
